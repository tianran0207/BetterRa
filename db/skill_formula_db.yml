# 定义技能的技能公式
# 可以通过修改此文件修改技能公式
# 可通脚本指令 getvariableofpc 获取玩家变量, 通过不同的变量可区分玩家之间的技能公式
# 格式: 
#       - Skill: >   # 技能ID
#         Typeable: ># 对谁有效
#         Formula: > # 伤害公式
#         Casting: > # 咏唱公式
#         Delay: >   # 技能延迟公式
#         Duration: > # 持续时间公式(如果技能无持续时间, 则无效果)
#         OnPlace:    # 当玩家进入地面技能后触发
#           PerTick:  # 每隔多少tick触发一次
#           Target:   # 目标敌对情况
#           Script:   # 触发后执行的脚本
# Typeable: (可以相加)
#	BL_PC		- 玩家单位
#	BL_MOB		- 魔物单位
#	BL_PET		- 宠物单位
#	BL_HOM		- 人工生命体单位
#	BL_MER		- 佣兵单位
#	BL_ITEM		- 物品单位 (拿到了也暂时用不上)
#	BL_SKILL	- 技能单位 (拿到了也暂时用不上)
#	BL_NPC		- NPC单位
#	BL_CHAT		- 聊天室单位 (拿到了也暂时用不上)
#	BL_ELEM		- 元素精灵单位 (拿到了也暂时用不上)
# Target: (可以相加)
#   BCT_SELF		= 0x010000, ///< 自己, 如果两个GID为相同时, 返回真
#	BCT_ENEMY		= 0x020000, ///< 敌对
#	BCT_PARTY		= 0x040000, ///< 队友
#	BCT_GUILDALLY	= 0x080000, ///< 公会盟友关系, 但非同公会
#	BCT_NEUTRAL		= 0x100000, ///< 中立
#	BCT_SAMEGUILD	= 0x200000, ///< 同公会, 非公会盟友
#
#	BCT_GUILD		= BCT_SAMEGUILD|BCT_GUILDALLY,	///< 公会成员和盟友
#	BCT_NOGUILD		= BCT_ALL&~BCT_GUILD,			///< 非公会同盟
#	BCT_NOPARTY		= BCT_ALL&~BCT_PARTY,			///< 非队友
#	BCT_NOENEMY		= BCT_ALL&~BCT_ENEMY,			///< 非敌对
# 注意: 使用 getsrcstatus  获得攻击者的基础战斗讯息, 
#       使用 gettargetstatus 获得目标的基础战斗讯息,
#       指令不需要与玩家关联, 公式中不要使用sleep等会延迟操作的指令
# skf_sgid 释放技能对象的GID
# skf_scid 释放技能玩家的CID 如果不是玩家则为0
# skf_tgid 技能所攻击目标的GID
# skf_id 技能ID
# skf_lv 技能等级
# skf_dmg 最终伤害 
# skf_tim 咏唱时间 延迟时间或持续时间


Header:
  Type: SKILL_FORMULA_DB
  Version: 1
  
